<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#111;
  color:white;
  font-family:Arial;
  padding:20px;
}

input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
}

iframe{
  width:100%;
  height:300px;
  margin-top:20px;
}
</style>
</head>

<body>

<h2>YouTube Player V4</h2>

<input
id="url"
placeholder="Paste URL YouTube">

<button onclick="playVideo()">
PLAY
</button>

<div id="player"></div>

<script>
function getVideoId(url){

  const reg =
  /(?:youtube\.com.*(?:\?|&)v=|youtu\.be\/)([^&]+)/;

  const match = url.match(reg);

  return match ? match[1] : null;
}

function playVideo(){

  const url =
  document.getElementById("url").value;

  const id = getVideoId(url);

  if(!id){

    alert("URL tidak valid");
    return;
  }

  document.getElementById("player")
  .innerHTML = `
  <iframe
    src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1"
    frameborder="0"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>
  `;
}
</script>

</body>
</html>
