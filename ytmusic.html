<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YT Player</title>

<style>
body{
  background:#111;
  color:white;
  font-family:Arial;
  padding:20px;
}

input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
}

button{
  background:red;
  color:white;
  border:none;
}

#player{
  margin-top:20px;
}
</style>
</head>
<body>

<h2>YouTube Player V2</h2>

<input
id="url"
placeholder="Paste URL YouTube">

<button onclick="playYT()">
PLAY
</button>

<p id="status">Siap</p>

<div id="player"></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player;

function getId(url){

  const reg =
  /(?:youtube\.com.*(?:\?|&)v=|youtu\.be\/)([^&]+)/;

  const match = url.match(reg);

  return match ? match[1] : null;
}

function playYT(){

  const url =
  document.getElementById("url").value;

  const videoId = getId(url);

  if(!videoId){

    alert("URL salah");
    return;
  }

  document.getElementById("status")
  .innerText = "Loading...";

  // hapus player lama
  document.getElementById("player")
  .innerHTML = "";

  player = new YT.Player('player', {

    height:'300',
    width:'100%',

    videoId:videoId,

    playerVars:{
      autoplay:1
    },

    events:{

      onReady:function(event){

        // unmute penting
        event.target.unMute();

        // volume
        event.target.setVolume(100);

        // play
        event.target.playVideo();

        document.getElementById("status")
        .innerText = "Sedang diputar";
      },

      onError:function(e){

        document.getElementById("status")
        .innerText =
        "Error code: " + e.data;
      }
    }
  });
}
</script>

</body>
</html>
