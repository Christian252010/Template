<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YT Background Audio</title>

<style>
body{
  background:#111;
  color:white;
  font-family:Arial;
  padding:20px;
}

.card{
  max-width:500px;
  margin:auto;
  background:#1e1e1e;
  padding:20px;
  border-radius:20px;
}

input,button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:10px;
}

button{
  background:red;
  color:white;
  font-size:16px;
}

#player{
  margin-top:20px;
}

/* jangan hide total */
iframe{
  width:100%;
  height:220px;
  border:none;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="card">

<h2>YouTube Background Player</h2>

<input
id="url"
placeholder="Paste URL YouTube">

<button onclick="playYT()">
PLAY
</button>

<p id="status">Siap</p>

<div id="player"></div>

</div>

<script>

// media session
if('mediaSession' in navigator){

  navigator.mediaSession.metadata =
  new MediaMetadata({
    title:'YT Background Audio',
    artist:'Web App'
  });
}

function getVideoId(url){

  const reg =
  /(?:youtube\.com.*(?:\?|&)v=|youtu\.be\/)([^&]+)/;

  const match = url.match(reg);

  return match ? match[1] : null;
}

function playYT(){

  const url =
  document.getElementById("url").value;

  const id = getVideoId(url);

  if(!id){

    alert("URL tidak valid");
    return;
  }

  document.getElementById("status")
  .innerText = "Memutar...";

  document.getElementById("player")
  .innerHTML = `
  <iframe
    src="https://www.youtube.com/embed/${id}?autoplay=1&mute=0&playsinline=1"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>
  `;
}
</script>

</body>
</html>
