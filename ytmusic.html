<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube Audio</title>

<style>
body{
  background:#111;
  color:white;
  font-family:Arial;
  padding:20px;
}

input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
}

iframe{
  width:100%;
  height:300px;
  margin-top:20px;
}
</style>
</head>
<body>

<h2>YouTube Audio Player V3</h2>

<input
id="url"
placeholder="Paste URL YouTube">

<button onclick="playYT()">
PLAY
</button>

<div id="result"></div>

<script>
function getVideoId(url){

  const reg =
  /(?:youtube\.com.*v=|youtu\.be\/)([^&]+)/;

  const match = url.match(reg);

  return match ? match[1] : null;
}

function playYT(){

  const url =
  document.getElementById("url").value;

  const id = getVideoId(url);

  if(!id){

    alert("URL tidak valid");
    return;
  }

  document.getElementById("result")
  .innerHTML = `
    <iframe
      src="https://www.youtube.com/embed/${id}?autoplay=1"
      frameborder="0"
      allow="autoplay"
      allowfullscreen>
    </iframe>
  `;
}
</script>

</body>
</html>
