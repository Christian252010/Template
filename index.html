<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Chat Player</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

body{
    background:#121212;
    color:white;
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    background:#1f1f1f;
    padding:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

#loginContainer{
    padding:15px;
    text-align:center;
}

#loginBtn{
    background:#4285F4;
}

#userInfo{
    display:none;
    align-items:center;
    gap:10px;
    padding:10px;
    background:#1f1f1f;
}

#avatar{
    width:40px;
    height:40px;
    border-radius:50%;
}

.chat-container{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.message{
    max-width:80%;
    padding:10px 14px;
    border-radius:12px;
    word-wrap:break-word;
}

.user{
    background:#2563eb;
    align-self:flex-end;
}

.other{
    background:#2d2d2d;
    align-self:flex-start;
}

.system{
    background:#14532d;
    align-self:center;
}

.player{
    background:#1a1a1a;
    padding:15px;
    border-top:1px solid #333;
}

#playerFrame{
    width:100%;
    aspect-ratio:16/9;
    border:none;
    border-radius:10px;
    display:none;
}

.input-area{
    display:flex;
    gap:10px;
    padding:15px;
    background:#1f1f1f;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
    background:#2d2d2d;
    color:white;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    cursor:pointer;
}
</style>
</head>
<body>

<header>
🎵 Music Chat Player
</header>

<div id="loginContainer">
    <button id="loginBtn">
        Login Dengan Google
    </button>
</div>

<div id="userInfo">
    <img id="avatar">
    <span id="username"></span>
</div>

<div class="chat-container" id="chat">

</div>

<div class="player">
    <iframe
        id="playerFrame"
        allow="autoplay; encrypted-media"
        allowfullscreen>
    </iframe>
</div>

<div class="input-area">
    <input
        id="commandInput"
        placeholder="Pesan atau /play URL">

    <button id="sendBtn">
        Kirim
    </button>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
