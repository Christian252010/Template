<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Chat Player Beta4</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

body{
    background:#121212;
    color:white;
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    background:#1f1f1f;
    padding:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

#loginContainer{
    padding:15px;
    text-align:center;
}

#loginBtn{
    background:#4285F4;
}

#userInfo{
    display:none;
    align-items:center;
    gap:10px;
    padding:10px;
    background:#1f1f1f;
}

#avatar{
    width:40px;
    height:40px;
    border-radius:50%;
}

.chat-container{
    flex:1;
    overflow-y:auto;
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.message{
    max-width:80%;
    padding:10px 14px;
    border-radius:12px;
    word-wrap:break-word;
}

.user{
    background:#2563eb;
    align-self:flex-end;
}

.other{
    background:#2d2d2d;
    align-self:flex-start;
}

.system{
    background:#14532d;
    align-self:center;
}

.player{
    background:#1a1a1a;
    padding:15px;
    border-top:1px solid #333;
}

#playerFrame{
    width:100%;
    aspect-ratio:16/9;
    border:none;
    border-radius:10px;
    display:none;
}

.input-area{
    display:flex;
    gap:10px;
    padding:15px;
    background:#1f1f1f;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
    background:#2d2d2d;
    color:white;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    cursor:pointer;
}
#loginContainer{
    padding:10px;
    text-align:center;
}

#userInfo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    background:#1f1f1f;
}

#avatar{
    width:40px;
    height:40px;
    border-radius:50%;
}

#replyPreview{
    display:none;
    padding:10px;
    background:#202020;
    border-left:4px solid #22c55e;
    justify-content:space-between;
    align-items:center;
}

#replyText{
    flex:1;
    color:#ccc;
}

#cancelReply{
    background:#ef4444;
}

.msg{
    display:flex;
    gap:10px;
}

.msg-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
}

.msg-content{
    flex:1;
}

.msg-header{
    display:flex;
    gap:10px;
    align-items:center;
}

.msg-name{
    color:white;
    font-weight:600;
}

.msg-time{
    color:#888;
    font-size:12px;
}

.msg-text{
    color:#d1d5db;
    margin-top:4px;
}

.reply-box{
    border-left:3px solid #555;
    padding-left:8px;
    margin-bottom:6px;
    color:#999;
    font-size:13px;
}

.panel{
    display:none;
}

.hidden{
    display:none;
}

#playerContainer{
    width:100%;
    background:#1a1a1a;
    padding:10px;
}

#youtubePlayer{
    width:100%;
    aspect-ratio:16/9;
    border-radius:12px;
    overflow:hidden;
}

.top-buttons{
    display:flex;
    gap:10px;
    padding:10px;
}

.controls{
    display:flex;
    gap:10px;
    padding:10px;
    justify-content:center;
}

.panel{
    display:none;
    padding:10px;
    background:#1f1f1f;
}

#queueList{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.queue-item{
    background:#2d2d2d;
    padding:10px;
    border-radius:8px;
}

.hidden{
    display:none !important;
}
</style>
</head>
<body>

<header>
    🎵 Music Room Beta
</header>

<!-- LOGIN -->
<div id="loginContainer">
    <button id="loginBtn">
        Login Google
    </button>
</div>

<!-- USER -->
<div id="userInfo" style="display:none">
    <img id="avatar">
    <span id="username"></span>
</div>

<!-- TOP BUTTON -->
<div class="top-buttons">

    <button id="queueBtn">
        📋 Queue
    </button>

    <button id="settingsBtn">
        ⚙️
    </button>

</div>

<!-- QUEUE PANEL -->
<div id="queuePanel" class="panel">

    <h3>Queue</h3>

    <div id="queueList"></div>

</div>

<!-- SETTINGS -->
<div id="settingsPanel" class="panel">

    <h3>Audio</h3>

    <input
        type="range"
        id="volumeSlider"
        min="0"
        max="100"
        value="100">

    <button id="deafenBtn">
        🔇 Deafen
    </button>

    <button id="toggleVideoBtn">
        🎥 Toggle Video
    </button>

</div>

<!-- PLAYER -->
<div id="playerContainer">

    <div id="youtubePlayer"></div>

</div>

<!-- CONTROL -->
<div class="controls">

    <button id="playBtn">
        ▶
    </button>

    <button id="pauseBtn">
        ⏸
    </button>

    <button id="skipBtn">
        ⏭
    </button>

    <button id="stopBtn">
        ⏹
    </button>

</div>

<!-- CHAT -->
<div
class="chat-container"
id="chat">
</div>

<!-- REPLY -->
<div
id="replyPreview">

    <div id="replyText"></div>

    <button
    id="cancelReply">
        ✕
    </button>

</div>

<!-- INPUT -->
<div class="input-area">

    <input
    id="commandInput"
    placeholder="Pesan atau /play URL">

    <button
    id="sendBtn">
        Kirim
    </button>

</div>

<!-- YOUTUBE API -->
<script src="https://www.youtube.com/iframe_api"></script>

<!-- APP -->
<script
type="module"
src="app.js">
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
